name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.5'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Verify clean generated output
        run: git status --porcelain dist | grep -q . && (echo "dist is not gitignored or build produced tracked changes" && exit 1) || true
